<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unit 3 · Lesson 8, part 2 · Plan a school trip</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#23324A;--bus:#FFC20E;--board:#1F5C4A;--apple:#E03C31;--sky:#6EC1F0;--paper:#FFFDF4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);padding:14px;background-color:#D1A06A;background-image:radial-gradient(#B98450 2px,transparent 2.5px),radial-gradient(#E3BD8A 2px,transparent 2.5px);background-size:26px 26px;background-position:0 0,13px 13px;background-attachment:fixed;overflow-x:hidden}
.wrap{position:relative;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.top{background:var(--board);color:#fff;border:6px solid #8B5A2B;border-radius:12px;padding:12px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;box-shadow:0 6px 0 #0006}
.top small{color:#FFE680;font-weight:800;letter-spacing:2px}.top h1{margin:0;font-size:clamp(24px,4vw,36px);font-weight:800;font-family:'Gaegu','Baloo 2',cursive}
.top .tt{display:flex;gap:14px;align-items:center}
.badge{background:var(--bus);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:2px 16px;font-weight:800;font-size:20px;display:inline-flex;gap:8px;align-items:center}
.fl{position:relative;height:62px;margin:0 8px;background:#4a4a52;border:4px solid var(--ink);border-radius:14px}
.fl .trk{position:absolute;left:10px;right:10px;top:50%;border-top:5px dashed #FFE680}
.fl .st{position:absolute;top:22px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--ink);margin-left:-8px}.fl .st.on{background:var(--apple)}
.fl .pl{position:absolute;top:2px;transition:left .9s cubic-bezier(.5,1.4,.5,1);margin-left:-36px}
.nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.nav span{font-weight:800;background:#fff8;border-radius:8px;padding:0 8px}
.nav button{border:3px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 14px;font-size:16px;font-weight:700;box-shadow:0 4px 0 var(--ink);transition:transform .15s;transform:rotate(-1deg)}
.nav button:nth-child(even){transform:rotate(1deg)}
.nav button:hover{transform:translateY(-2px)}.nav button.on{background:var(--bus);transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.card{position:relative;background:var(--paper);background-image:repeating-linear-gradient(0deg,transparent 0 33px,#6EC1F055 33px 34px);border:3px solid var(--ink);border-radius:8px 18px 18px 8px;padding:clamp(16px,3vw,28px) clamp(16px,3vw,28px) clamp(16px,3vw,28px) clamp(56px,7vw,78px);display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 #0004;animation:pop .45s}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:clamp(42px,5vw,56px);background:radial-gradient(circle at 24px 50%,#23324A 8px,transparent 9px) 0 0/100% 38px repeat-y;border-right:3px solid #E0A0A0;opacity:.85}
.card:after{content:"";position:absolute;right:30px;top:-14px;width:26px;height:26px;border-radius:50%;background:var(--apple);border:3px solid var(--ink);box-shadow:0 4px 0 #0004}
.card h2{margin:0;font-size:clamp(20px,3vw,28px)}
.meta{display:flex;justify-content:space-between;font-weight:800;font-size:18px;flex-wrap:wrap;gap:6px;padding-bottom:8px;border-bottom:3px solid var(--apple)}
.q{font-size:clamp(22px,3.4vw,32px);font-weight:800;line-height:1.3}.q b{color:#B02A21;background:#FFE3DF;border-radius:6px;padding:0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.o{display:flex;align-items:center;justify-content:center;gap:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);border-radius:12px;padding:14px 18px;font-size:clamp(18px,2.6vw,24px);font-weight:700;box-shadow:0 5px 0 var(--ink);transition:transform .12s}
.grid .o:nth-child(4n+1){background:#FFF2B8}.grid .o:nth-child(4n+2){background:#D3F0FF}.grid .o:nth-child(4n+3){background:#FFD9D4}.grid .o:nth-child(4n+4){background:#D6F5D9}
.o:hover:not(:disabled){transform:translateY(-3px)}.o:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.grid .o.ok,.o.ok{background:#8EE6A8}.grid .o.bad,.o.bad{background:#FF9E95;animation:shake .4s}.o.pk,.grid .o.pk{background:var(--bus)}.o:disabled{cursor:default}
.fb{font-size:22px;font-weight:700;min-height:44px;display:flex;align-items:center;gap:10px}
.mark{display:inline-block;font-family:'Gaegu','Baloo 2',cursive;font-size:36px;font-weight:800;color:var(--apple);border:4px solid var(--apple);border-radius:50%;width:62px;height:62px;line-height:54px;text-align:center;transform:rotate(-10deg);animation:stampin .4s;flex:none;background:#fff}.mark.no{color:#6b6b78;border-color:#6b6b78;font-size:20px;line-height:54px}
.go{align-self:flex-end;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 32px;font-size:21px;font-weight:800;box-shadow:0 5px 0 #0c1424}
.go.alt{background:var(--apple);box-shadow:0 5px 0 #8f2620}.go[disabled]{opacity:.35}.go:active{transform:translateY(3px)}
.row{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.box{background:#fff;border:3px dashed var(--ink);border-radius:12px;padding:12px 20px;font-size:clamp(18px,2.4vw,22px);line-height:1.8}.box b{color:#B02A21}
.learn{background:#D3F0FF;border:3px solid var(--ink);border-radius:12px;padding:10px 18px;font-size:19px}
.cz{display:grid;grid-template-columns:40px repeat(3,1fr);gap:8px;align-items:center}.cz .o{padding:6px 12px;justify-content:flex-start;border-color:transparent;box-shadow:none;background:transparent!important;font-size:clamp(17px,2.2vw,22px)}.cz .o.sel{border-color:var(--ink);background:#fff!important}
.cz .o.ok{background:#8EE6A8!important}.cz .o.bad{background:#FF9E95!important}
.dot{width:26px;height:16px;border:3px solid var(--ink);border-radius:50%;background:#fff;flex:none}.sel .dot{background:var(--ink)}
.q2{font-size:clamp(19px,2.5vw,24px);font-weight:800;margin-top:4px}
.tl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lt{border:4px solid var(--ink);border-radius:18px;padding:18px 12px;font-size:clamp(18px,2.4vw,24px);font-weight:800;color:var(--ink);box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px}
.lt i{width:44px;height:44px;border-radius:50%;border:4px solid var(--ink);display:block}.lt.sel{outline:6px solid var(--bus)}
.credit{text-align:right;font-size:15px;font-weight:700;background:#fff8;border-radius:8px;padding:0 8px;align-self:flex-end}
.big-stamp{align-self:center;font-family:'Gaegu','Baloo 2',cursive;font-size:clamp(40px,7vw,64px);font-weight:800;color:var(--apple);border:6px solid var(--apple);border-radius:16px;padding:0 26px;transform:rotate(-5deg);animation:stampin .5s;background:#fff}
@keyframes pop{0%{transform:scale(.96);opacity:.4}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes stampin{0%{transform:scale(2.2) rotate(-18deg);opacity:0}100%{transform:scale(1) rotate(-8deg);opacity:1}}
</style></head><body>
<div class="wrap">
<div class="top"><div class="tt"><svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><path d="M8 46l4-12L38 8l8 8-26 26z" fill="#FFC20E" stroke="#23324A" stroke-width="3" stroke-linejoin="round"/><path d="M8 46l4-12 8 8z" fill="#FFE3B0" stroke="#23324A" stroke-width="3" stroke-linejoin="round"/><path d="M38 8l8 8 4-4-8-8z" fill="#E03C31" stroke="#23324A" stroke-width="3" stroke-linejoin="round"/></svg><div><small>SCHOOL TRIP NOTEBOOK · UNIT 3 · TRAVEL · LESSON 8, PART 2</small><h1>Plan a School Trip</h1></div></div><div style="text-align:right"><span class="badge"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 7 7.500.600-5.700 5 1.800 7.400L12 18l-6.600 4 1.800-7.400-5.700-5L9 9z" fill="#E03C31" stroke="#23324A" stroke-width="1.500" stroke-linejoin="round"/></svg><span id="stars"></span> Stickers</span><br><small style="letter-spacing:0">Lesson time: 25 minutes</small></div></div>
<div class="fl"><div class="trk"></div><div id="stations"></div><span class="pl" id="pl"><svg width="76" height="46" viewBox="0 0 76 46" aria-hidden="true"><rect x="3" y="6" width="68" height="30" rx="8" fill="#FFC20E" stroke="#23324A" stroke-width="3"/><rect x="9" y="11" width="11" height="10" rx="2" fill="#E9F7FF" stroke="#23324A" stroke-width="2"/><rect x="24" y="11" width="11" height="10" rx="2" fill="#E9F7FF" stroke="#23324A" stroke-width="2"/><rect x="39" y="11" width="11" height="10" rx="2" fill="#E9F7FF" stroke="#23324A" stroke-width="2"/><rect x="54" y="11" width="13" height="14" rx="2" fill="#E9F7FF" stroke="#23324A" stroke-width="2"/><rect x="6" y="26" width="60" height="3" fill="#23324A"/><circle cx="20" cy="38" r="6" fill="#23324A"/><circle cx="56" cy="38" r="6" fill="#23324A"/><circle cx="20" cy="38" r="2.500" fill="#fff"/><circle cx="56" cy="38" r="2.500" fill="#fff"/></svg></span></div>
<div class="nav" id="nav"></div>
<div id="main"></div>

<script>
const N=a=>a.map(t=>({t}));
const A=[
{n:'1 · Don’t say it!',min:3,type:'mc',q:[
{pr:'An <b>express</b> bus is a bus that ___.',o:N(['makes no stops on the way','is very old','is full of children']),a:0},
{pr:'A road is <b>busy</b> when it is ___.',o:N(['empty','full of vehicles','very long']),a:1},
{pr:'You are <b>lucky</b> when something good happens to you ___.',o:N(['by chance','every day','at school']),a:0},
{pr:'<b>Lovely</b> means ___.',o:N(['very nice','very big','very old']),a:0},
{pr:'<b>Brand-new</b> means ___.',o:N(['broken','not old','very cheap']),a:1},
{pr:'<b>Wonderful</b> means ___.',o:N(['boring','small','great, amazing']),a:2}]},
{n:'2 · Three facts and a fib',min:3,type:'mc',q:[
{pr:'Three facts and a fib about the Bahla email. Find the fib!',o:N(['The trip is next Sunday.','The express coach leaves at 4.30 p.m.','The coach back to Muscat leaves at 11 a.m.']),a:2,ex:'It leaves at 9 a.m. and arrives at the school at about 11 a.m.'},
{pr:'Three facts and a fib about the Bahla email. Find the fib!',o:N(['Dinner is at 7 p.m. every evening.','The weather in Bahla is usually cold.','Bahla Fort has been a UNESCO World Heritage site since 1987.']),a:1,ex:'The weather is usually hot in Bahla.'},
{pr:'Three facts and a fib about the Bahla email. Find the fib!',o:N(['The children must wear trainers or comfortable shoes.','The hotel is far from the Bahla fort.','They are going to look around the fort and the souq.']),a:1,ex:'The hotel is near the famous Bahla fort.'}]},
{n:'3 · Answer the questions',min:4,type:'mc',q:[
{pr:'What is at the same time every evening?',o:N(['Breakfast','Dinner is at the same time every evening.','The swim']),a:1},
{pr:'What is the head teacher sure they will have?',o:N(['The head teacher is sure that they will have a lovely time.','The head teacher is sure that they will be late.','The head teacher is sure that it will rain.']),a:0},
{pr:'Who wrote the email?',o:N(['Mr Sultan, the head teacher','A student','The hotel manager']),a:0},
{pr:'When does the coach back to Muscat leave?',o:N(['At 4.30 p.m. on Sunday','At 9 a.m. on Tuesday','At 7 p.m. on Monday']),a:1},
{pr:'Which place has been a UNESCO World Heritage site since 1987?',o:N(['The hotel','Bahla Fort','Muscat school']),a:1},
{pr:'What are they going to look around besides the fort?',o:N(['The airport and the beach','The town and the souq','The forest and the lake']),a:1}]},
{n:'4 · Plan a school trip',min:7,type:'plan'},
{n:'5 · Why school trips?',min:3,type:'think'},
{n:'6 · Traffic lights',min:2,type:'conf'},
{n:'7 · Final task',min:3,type:'cloze'}];
const CL=6;
const PL=['a theme park','a local farm','a planetarium','a science museum','a sports centre'];
const ACT=[['ride the big roller coaster','watch a stunt show','try the water slides'],['feed the animals','pick fresh fruit','ride a tractor'],['watch the star show','see the planets','learn about the Moon'],['do science experiments','see the robots','touch the dinosaur bones'],['play basketball','swim in the pool','try the climbing wall']];
const TH=['We see real things and not only photos.','We learn new words in real situations.','We can work with friends in groups.','We practise speaking English.','It is more fun than sitting in class.','We can ask experts questions.','We can use maps and timetables for real.','We remember things better.'];
const CF=[['Green','I can use it!','#8EE6A8','Fantastic! You can read and plan a school trip!'],['Yellow','I need a little help','#FFE680','No problem! Look at the email again.'],['Red','I need more practice','#FF9E95','That’s OK! Try parts 1 to 3 again.']];
const C={t:'Dear students, we are going to go on a {0} (1) trip to the science museum. We’ll travel by {1} (2) coach, so we won’t stop on the way. The roads are very {2} (3) in the morning, so please don’t be late. The museum has a {3} (4) planetarium that opened last month. We’re sure you will have a {4} (5) time!',o:[['one-day','one-hour','one-year'],['busy','express','lucky'],['lovely','busy','express'],['brand-new','busy','lucky'],['lucky','lovely','express']],a:[0,1,1,0,1]};
const nst=()=>({i:0,pk:null,sc:0,done:false,ans:{},chk:false,p:{},th:{},place:null,cf:null});
let S={step:0,st:A.map(nst)};
let ac;function tone(f,d,ty){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();f.forEach((hz,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty||'sine';o.frequency.value=hz;const t=ac.currentTime+i*d;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)})}catch(e){}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const GOOD=()=>tone([523,659,784,1047],.1,'triangle'),BAD=()=>tone([220,160],.2,'sawtooth');
function go(k){tone([523,659],.1);try{speechSynthesis.cancel()}catch(e){}S.step=k;render()}
function pick(i){const s=S.st[S.step],q=A[S.step].q[s.i];if(s.pk!==null)return;s.pk=i;if(i===q.a){s.sc++;GOOD()}else BAD();render()}
function nxt(){const s=S.st[S.step],a=A[S.step];if(s.pk===null)return;if(s.i+1<a.q.length){s.i++;s.pk=null}else{s.done=true;tone([523,659,784,1047],.14,'triangle')}render()}
function retry(){S.st[S.step]=nst();tone([440,523],.1);render()}
function pp(k,v){const s=S.st[3];if(k==='place'&&s.p.place!==v){s.p={place:v}}else s.p[k]=v;s.sc=PK.every(x=>s.p[x]!==undefined)?1:0;tone([660],.08);render()}
const PK=['place','start','finish','travel','act','lunch','enjoy'];
function ptext(){const p=S.st[3].p,pl=PL[p.place];return 'Dear students, we are going to go to '+pl+'. We’re going to start at '+['8 a.m.','9 a.m.','10 a.m.'][p.start]+' and finish at '+['2 p.m.','3 p.m.','4 p.m.'][p.finish]+'. We’re going to travel '+['by coach','by minibus','by train'][p.travel]+'. There we’re going to '+ACT[p.place][p.act]+'. We’re going to have '+['lunch at a café','a picnic','a snack at the snack bar'][p.lunch]+'. We’ll probably enjoy it when we '+ACT[p.place][p.enjoy]+'. Yours, Class 7'}
function phear(){say(ptext())}
function th(i){const s=S.st[4];if(s.th[i])delete s.th[i];else if(Object.keys(s.th).length<3)s.th[i]=1;else{BAD();return}s.sc=Object.keys(s.th).length;tone([660],.08);render()}
function cf(i){const s=S.st[5];s.cf=i;s.sc=1;tone([[523,659,784],[440,523],[330,392]][i],.12,'triangle');say(CF[i][3]);render()}
function cl(g,i){const s=S.st[CL];if(s.chk)return;s.ans[g]=i;tone([660],.08);render()}
function chk(){const s=S.st[CL];if(Object.keys(s.ans).length<5){tone([220],.15,'square');return}s.chk=true;const n=C.a.filter((a,g)=>s.ans[g]===a).length;tone(n>=4?[523,659,784,1047]:[392,330,262],.14,'triangle');render()}
function stars(){const s=S.st;return s.slice(0,CL).reduce((x,y)=>x+y.sc,0)+(s[CL].chk?C.a.filter((a,g)=>s[CL].ans[g]===a).length:0)}
function mc(a,s){
 const q=a.q[s.i],n=a.q.length,lk=s.pk!==null,ok=lk&&s.pk===q.a;
 if(s.done)return '<div class="card"><h2>'+a.n+'</h2><div class="big-stamp">'+s.sc+' / '+n+'</div><div class="fb" style="justify-content:center">'+(s.sc===n?'A+ Excellent work!':s.sc>=n-1?'Well done!':'Good try! Play again.')+'</div><div class="row"><button class="go alt" onclick="retry()">Play again</button>'+(S.step<CL?'<button class="go" onclick="go('+(S.step+1)+')">Next stop →</button>':'')+'</div></div>';
 const pr=q.pr.replace('___',lk?'<b>'+q.o[q.a].t+'</b>':'______');
 return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Question '+(s.i+1)+' / '+n+' · Stickers: '+s.sc+'</span></div><div class="q">'+pr+'</div><div class="grid">'+q.o.map((o,i)=>'<button class="o'+(lk&&i===q.a?' ok':lk&&i===s.pk?' bad':'')+'" '+(lk?'disabled':'')+' onclick="pick('+i+')"><span>'+o.t+'</span></button>').join('')+'</div><div class="fb">'+(lk?'<span class="mark'+(ok?'':' no')+'">'+(ok?'A+':'Oops')+'</span><span>The answer is: '+q.o[q.a].t+'. '+(q.ex||'')+'</span>':'Choose the correct answer.')+'</div><button class="go" onclick="nxt()" '+(lk?'':'disabled')+'>'+(s.i+1===n?'Finish':'Next →')+'</button></div>'}
function ch(k,opts,s,cap){return '<div><div class="q2">'+cap+'</div><div class="grid" style="margin-top:6px">'+opts.map((x,i)=>'<button class="o'+(s.p[k]===i?' pk':'')+'" onclick="pp(\''+k+'\','+i+')"><span>'+x+'</span></button>').join('')+'</div></div>'}
function view(){
 const a=A[S.step],s=S.st[S.step];
 if(a.type==='mc')return mc(a,s);
 if(a.type==='plan'){const p=s.p,done=PK.every(x=>p[x]!==undefined);return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Stickers: '+s.sc+'</span></div><div class="learn"><b>Work in groups.</b> Plan a one-day school trip. Choose a place and answer the questions. Then hear your email!</div>'+ch('place',PL,s,'1 Where will you go for your trip?')+(p.place!==undefined?ch('start',['8 a.m.','9 a.m.','10 a.m.'],s,'2 What time will you start?')+ch('finish',['2 p.m.','3 p.m.','4 p.m.'],s,'… and finish the trip?')+ch('travel',['by coach','by minibus','by train'],s,'3 How will you travel there and back?')+ch('act',ACT[p.place],s,'4 What will you do and see there?')+ch('lunch',['lunch at a café','a picnic','a snack at the snack bar'],s,'5 Where will you have lunch or a snack?')+ch('enjoy',ACT[p.place],s,'6 What will you probably enjoy the most?'):'')+(done?'<div class="box"><b>Our trip email</b><br>'+ptext()+'</div><div class="row"><button class="go alt" onclick="phear()">▶ Hear our email</button></div>':'')+'</div>'}
 if(a.type==='think'){const k=Object.keys(s.th);return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Stickers: '+s.sc+'</span></div><h2>How do school trips help us with our learning? Choose up to three reasons.</h2><div class="grid" style="grid-template-columns:1fr">'+TH.map((d,i)=>'<button class="o'+(s.th[i]?' pk':'')+'" style="justify-content:flex-start;text-align:left" onclick="th('+i+')"><span>'+d+'</span></button>').join('')+'</div>'+(k.length?'<div class="box"><b>School trips help me because:</b><br>'+k.map(i=>'• '+TH[i]).join('<br>')+'</div>':'')+'</div>'}
 if(a.type==='conf')return '<div class="card"><h2>'+a.n+' · '+a.min+' min — How did the lesson go?</h2><div class="learn">How confident do you feel about <b>reading and understanding an email</b> about a school trip?</div><div class="tl">'+CF.map((c,i)=>'<button class="lt'+(s.cf===i?' sel':'')+'" style="background:'+c[2]+'" onclick="cf('+i+')"><i style="background:'+(i?i===1?'#FFC20E':'#E03C31':'#1FA971')+'"></i>'+c[0]+'<span style="font-size:.7em;font-weight:700">'+c[1]+'</span></button>').join('')+'</div><div class="fb">'+(s.cf!==null?CF[s.cf][3]:'')+'</div><button class="go alt" onclick="go(6)">Final task →</button></div>';
 const g=i=>'<b>'+(s.ans[i]===undefined?'______':C.o[i][s.ans[i]])+'</b>',n=C.a.filter((x,i)=>s.ans[i]===x).length;
